name: Daily Recipe Scraper

on:
  schedule:
    - cron: '15 15 * * *' # 한국 시간 기준 매일 밤 12시 15분 실행 (UTC 15:15)
  workflow_dispatch: # 직접 '실행' 버튼 눌러서 테스트하고 싶을 때 사용

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run main script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_data.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "recipe-bot"
          git config --global user.email "bot@github.com"
          git add *.csv
          git commit -m "Add daily stats for $(date +'%Y-%m-%d') [skip ci]" || echo "No changes to commit"
          git push
